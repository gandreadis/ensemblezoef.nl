zoef-in-picture:
  title: ZOEF in beeld
  episode-1:
    title: "Aflevering 1: Amersfoort"
    text: |
      Hoe geef je ruimte aan verhalen die zelden gehoord worden? Met Cultureel Zwerfgoed trekt Ensemble ZOEF langs opvanglocaties van het Leger des Heils om samen met bewoners muziek te maken en spelen. In nauwe samenwerking met het Leger des Heils bezochten we vanaf april 2024 negen maatschappelijke opvanglocaties door heel Nederland om verborgen belevingswerelden via muziek een plekje te kunnen geven! Door middel van workshops en concerten op locatie brachten we de muziek terug op de plek waar deze gehoord verdient te worden. De bijzondere ontmoetingen op deze plekken zullen ons nog ons hele leven bij blijven. Onze grote dank gaat uit naar Pixel Universe, die vanuit hun bijzonder integere houding de verhalen heeft weten vast te leggen. Deze aflevering zoomt in op het waarom van Cultureel Zwerfgoed: het laat zien hoe muziek een sleutel kan zijn tot ontmoeting, eigenaarschap en menselijkheid op een plek waar dat niet vanzelfsprekend is.
  episode-2:
    title: "Aflevering 1: Rotterdam"
    text: |
      In iedereen huist muziek. Met Cultureel Zwerfgoed trekt Ensemble ZOEF langs opvanglocaties van het Leger des Heils om samen met bewoners muziek te maken en spelen. In nauwe samenwerking met het Leger des Heils bezochten we vanaf april 2024 negen maatschappelijke opvanglocaties door heel Nederland om verborgen belevingswerelden via muziek een plekje te kunnen geven! Door middel van workshops en concerten op locatie brachten we de muziek terug op de plek waar deze gehoord verdient te worden. De bijzondere ontmoetingen op deze plekken zullen ons nog ons hele leven bij blijven. Onze grote dank gaat uit naar Pixel Universe, die vanuit hun bijzonder integere houding de verhalen heeft weten vast te leggen. Deze aflevering zoomt in op het hoe van Cultureel Zwerfgoed: co-creatie als sleutel tot eigenaarschap, verbinding en herstel.

